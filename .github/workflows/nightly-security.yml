name: Nightly Security

# NOTE: nightly schedule disabled 2026-07-29 because every scheduled run for the
# preceding week+ failed at the `npm audit` (audit-ci) step, producing a daily
# red email with no new signal.
#
# The underlying audit failure has since been FIXED in the same series of commits
# that added this note — the repo now reports 0 vulnerabilities and audit-ci
# passes. The schedule is left commented out only because switching it back on is
# the repo owner's call, not because anything is still broken.
#
# Root cause, recorded because it was badly misdiagnosed twice: eslint 10 was
# incompatible with the peer ranges of eslint-plugin-jsx-a11y and
# eslint-plugin-react, so npm could not build a fresh dependency tree at all
# (ERESOLVE on any clean install). Rather than failing loudly, npm silently
# reused the existing node_modules — which meant the root `overrides` block never
# applied and transitive dependencies never advanced past their vulnerable
# versions. Fixing the peer conflict made overrides live again and the advisories
# resolved. See the history note in audit-ci.jsonc for the full account.
#
# TO RE-ENABLE: uncomment the `schedule:` block below. Optionally confirm first
# with `npx audit-ci@7.1.0 --config audit-ci.jsonc` and
# `gh workflow run nightly-security.yml`.
#
# Note that `security.yml` also runs as a blocking stage in `ci.yml`, so audit
# regressions are still caught on every PR regardless of this schedule.
on:
  # schedule:
  #   - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit
